# Build y release de la imagen Docker en Docker Hub.
#
# Replica el flujo del Makefile (IMAGE=rubn1987/sesame-bot, TAG=v$(VERSION)):
#   - Push a main:  build de validación siempre; publica SOLO si el commit
#     modifica el archivo VERSION (flujo: edita VERSION, haz commit, push).
#   - Manual (workflow_dispatch): publica la rama elegida, con opción de
#     solo validar sin publicar.
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME — usuario de Docker Hub (rubn1987)
#   DOCKERHUB_TOKEN    — access token de Docker Hub (no la contraseña)

name: docker-release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Publicar la imagen en Docker Hub'
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE: rubn1987/sesame-bot

jobs:
  build:
    name: Build imagen (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Leer versión
        id: version
        run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: ¿Publicar? (solo si cambia VERSION o ejecución manual)
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.push_image }}" = "false" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          # SHA nulo (todo ceros) o inválido = no hay commit previo conocido
          if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || [[ "$BEFORE" =~ ^0+$ ]]; then
            BEFORE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -n "$BEFORE" ] && git diff --quiet "$BEFORE" HEAD -- VERSION; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "VERSION sin cambios — build de validación sin publicar"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "VERSION cambiada — se publicará $(cat VERSION | sed 's/^/v/')"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login en Docker Hub
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.release.outputs.publish == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          if [ "${{ steps.release.outputs.publish }}" = "true" ]; then
            echo "✅ Publicada \`${{ env.IMAGE }}:${{ steps.version.outputs.tag }}\` (y \`latest\`) en Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🔎 Build de validación OK — sin publicar (VERSION sin cambios)" >> "$GITHUB_STEP_SUMMARY"
          fi
