<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Sesame Bot{{end}}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; min-height: 100vh; margin: 0; color: #1d1d1f; }

    /* ── App shell ──────────────────────────────────────── */
    .app { display: flex; min-height: 100vh; }

    /* ── Sidebar ────────────────────────────────────────── */
    .sidebar {
      width: 220px; min-width: 220px;
      background: #fff; border-right: 1.5px solid #f0f0f5;
      display: flex; flex-direction: column;
      padding: 1.5rem 1rem 1.25rem;
      position: fixed; top: 0; left: 0; height: 100vh;
      overflow-y: auto; z-index: 50;
      transition: transform .25s cubic-bezier(.4,0,.2,1);
    }
    .sidebar-brand {
      font-weight: 700; font-size: 1.05rem; color: #1d1d1f;
      text-decoration: none; display: block;
      margin-bottom: 1.75rem; padding: 0 .25rem;
    }
    .sidebar-nav { display: flex; flex-direction: column; gap: .1rem; flex: 1; }
    .sidebar-nav a {
      display: flex; align-items: center;
      padding: .6rem .75rem; border-radius: 10px;
      font-size: .875rem; color: #6e6e73;
      text-decoration: none; font-weight: 500;
      transition: background .12s, color .12s;
    }
    .sidebar-nav a:hover { background: #f5f5f7; color: #1d1d1f; }
    .sidebar-nav a.active { background: #f0f0f5; color: #1d1d1f; font-weight: 600; }
    .sidebar-footer {
      margin-top: 1.25rem; padding-top: 1.1rem;
      border-top: 1.5px solid #f0f0f5;
    }
    .sidebar-user {
      font-size: .76rem; color: #aeaeb2;
      margin-bottom: .65rem; padding: 0 .25rem;
      word-break: break-all; line-height: 1.4;
    }
    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.35); z-index: 40;
    }
    .sidebar-overlay.open { display: block; }

    /* ── Main area ──────────────────────────────────────── */
    .main { margin-left: 220px; flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      display: none; align-items: center; gap: .85rem;
      padding: .75rem 1.1rem; background: #fff;
      border-bottom: 1.5px solid #f0f0f5;
      position: sticky; top: 0; z-index: 30;
    }
    .topbar-brand { font-weight: 700; font-size: .98rem; color: #1d1d1f; text-decoration: none; }
    .hamburger {
      background: none; border: none; padding: .3rem;
      cursor: pointer; color: #1d1d1f;
      display: flex; align-items: center; border-radius: 8px;
    }
    .hamburger:hover { background: #f5f5f7; }
    .content-area { padding: 2rem 2.5rem 3rem; width: 100%; max-width: 1100px; }

    /* No-sidebar (login/register) */
    .main.no-sidebar { margin-left: 0; justify-content: center; align-items: center; min-height: 100vh; }
    .main.no-sidebar .content-area { max-width: 480px; padding: 2.5rem 1.25rem; }

    /* ── Cards ──────────────────────────────────────────── */
    .card {
      background: #fff; border-radius: 16px;
      padding: 2rem; margin-bottom: 1.5rem;
      box-shadow: 0 2px 16px rgba(0,0,0,.06);
    }
    .card-sm { max-width: 420px; }

    /* ── Typography ─────────────────────────────────────── */
    h1 { font-size: 1.45rem; font-weight: 700; margin: 0 0 1.5rem; letter-spacing: -.025em; }
    h2 { font-size: 1.05rem; font-weight: 600; margin: 0 0 1.1rem; letter-spacing: -.02em; }

    /* ── Forms ──────────────────────────────────────────── */
    label {
      display: block; font-size: .775rem; font-weight: 500;
      color: #6e6e73; text-transform: uppercase;
      letter-spacing: .055em; margin-top: 1.1rem;
    }
    .hint { font-size: .8em; color: #aeaeb2; font-weight: 400; text-transform: none; letter-spacing: 0; }
    input[type=text], input[type=email], input[type=password], input[type=number], select, textarea {
      width: 100%; padding: .6rem .8rem; margin-top: .3rem;
      border: 1.5px solid #e0e0e5; border-radius: 10px;
      font-size: .93rem; color: #1d1d1f; background: #fafafa;
      outline: none; transition: border-color .15s, box-shadow .15s;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0071e3; box-shadow: 0 0 0 3px rgba(0,113,227,.12); background: #fff;
    }
    select[multiple] { padding: .5rem .8rem; line-height: 1.8; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.25rem; }

    /* ── Buttons ────────────────────────────────────────── */
    .btn {
      display: inline-block; padding: .6rem 1.75rem;
      border: none; border-radius: 10px; background: #0071e3; color: #fff;
      font-size: .93rem; font-weight: 500; cursor: pointer;
      transition: background .15s, transform .1s;
      font-family: inherit; text-decoration: none; text-align: center;
    }
    .btn:hover { background: #0077ed; }
    .btn:active { transform: scale(.98); }
    .btn-sm { padding: .4rem 1rem; font-size: .83rem; border-radius: 8px; }
    .btn-danger { background: #e3001a; }
    .btn-danger:hover { background: #c0001a; }
    .btn-ghost { background: transparent; color: #6e6e73; border: 1.5px solid #e0e0e5; }
    .btn-ghost:hover { background: #f5f5f7; color: #1d1d1f; }

    /* ── Flash ──────────────────────────────────────────── */
    .flash-ok {
      display: flex; align-items: center; gap: .5rem;
      padding: .65rem 1rem; border-radius: 10px;
      background: #f0faf4; color: #1a7f4b;
      font-size: .875rem; margin-bottom: 1.1rem;
    }
    .flash-err {
      display: flex; align-items: center; gap: .5rem;
      padding: .65rem 1rem; border-radius: 10px;
      background: #fff2f2; color: #c0392b;
      font-size: .875rem; margin-bottom: 1.1rem;
    }

    /* ── Password input ─────────────────────────────────── */
    .pw-wrap { position: relative; margin-top: .3rem; }
    .pw-wrap input { margin-top: 0; padding-right: 2.8rem; }
    .pw-toggle {
      position: absolute; right: .65rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; padding: .25rem;
      cursor: pointer; color: #aeaeb2; display: flex; align-items: center;
    }
    .pw-toggle:hover { color: #1d1d1f; }

    /* ── Tables ─────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; font-size: .875rem; margin-top: .5rem; }
    th { text-align: left; font-size: .75rem; font-weight: 600; color: #6e6e73; text-transform: uppercase; letter-spacing: .05em; padding: .5rem .75rem; border-bottom: 1.5px solid #e0e0e5; }
    td { padding: .6rem .75rem; border-bottom: 1px solid #f0f0f5; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }

    /* ── Badges ─────────────────────────────────────────── */
    .badge { display: inline-block; padding: .2rem .6rem; border-radius: 20px; font-size: .75rem; font-weight: 600; }
    .badge-ok, .badge-active { background: #e8f9ee; color: #1a7f4b; }
    .badge-err, .badge-inactive { background: #fff0f0; color: #c0392b; }
    .badge-skip { background: #f5f5f7; color: #6e6e73; }

    /* ── Misc ───────────────────────────────────────────── */
    .actions { margin-top: 1.5rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .section-divider { border: none; border-top: 1.5px solid #f0f0f5; margin: 1.5rem 0; }

    /* ── Tabs ───────────────────────────────────────────── */
    .tabs {
      display: flex; gap: .15rem;
      border-bottom: 2px solid #f0f0f5; margin-bottom: 1.5rem;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: .6rem 1.1rem; background: none; border: none;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      font-size: .875rem; font-weight: 500; color: #6e6e73;
      cursor: pointer; font-family: inherit;
      border-radius: 8px 8px 0 0; transition: color .15s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #1d1d1f; }
    .tab-btn.active { color: #0071e3; border-bottom-color: #0071e3; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Accordion ──────────────────────────────────────── */
    .acc-item { border: 1.5px solid #f0f0f5; border-radius: 12px; margin-top: .45rem; }
    .acc-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: .75rem 1rem; cursor: pointer; background: none; border: none;
      width: 100%; font-family: inherit; font-size: .9rem;
      font-weight: 600; color: #1d1d1f; text-align: left;
      border-radius: 10px;
    }
    .acc-header:hover { background: #fafafa; }
    .acc-right { display: flex; align-items: center; gap: .65rem; }
    .acc-status { font-size: .775rem; color: #aeaeb2; font-weight: 400; }
    .acc-status.has-override { color: #1a7f4b; font-weight: 500; }
    .acc-chevron { color: #aeaeb2; transition: transform .2s; display: flex; }
    .acc-item.open .acc-chevron { transform: rotate(180deg); }
    .acc-body { display: none; padding: .75rem 1rem 1rem; border-top: 1.5px solid #f0f0f5; }
    .acc-item.open .acc-body { display: block; }

    /* ── Mobile ─────────────────────────────────────────── */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); box-shadow: none; }
      .sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,.12); }
      .main { margin-left: 0; }
      .topbar { display: flex; }
      .content-area { padding: 1.25rem 1rem 2rem; }
      .form-row { grid-template-columns: 1fr; }
      .card { padding: 1.5rem 1.25rem; }
      .btn-label { display: none; }
    }
  </style>
</head>
<body>
<div class="app">
  {{if .User}}
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <a href="/" class="sidebar-brand">Sesame Bot</a>
    <nav class="sidebar-nav" id="sidebar-nav">
      <a href="/dashboard">Dashboard</a>
      <a href="/config">Configuración</a>
      <a href="/logs">Historial</a>
      {{if .User.IsAdmin}}<a href="/admin">Admin</a>{{end}}
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">{{.User.Email}}</div>
      <form method="POST" action="/logout">
        <button type="submit" class="btn btn-ghost btn-sm" style="width:100%">Salir</button>
      </form>
    </div>
  </aside>
  {{end}}

  {{if .User}}<div class="main">{{else}}<div class="main no-sidebar">{{end}}
    {{if .User}}
    <div class="topbar">
      <button class="hamburger" onclick="toggleSidebar()" aria-label="Menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <a href="/" class="topbar-brand">Sesame Bot</a>
    </div>
    {{end}}
    <div class="content-area">
      {{block "content" .}}{{end}}
    </div>
  </div>
</div>
<script>
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}
(function() {
  var nav = document.getElementById('sidebar-nav');
  if (!nav) return;
  var path = location.pathname;
  nav.querySelectorAll('a').forEach(function(a) {
    if (a.getAttribute('href') === path) a.classList.add('active');
  });
})();
</script>
</body>
</html>
